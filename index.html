:root{--bg:#f4f7fb;--card:#fff;--text:#15202b;--muted:#667085;--line:#e4e9f0;--blue:#0b5cab;--green:#15803d}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}header{background:linear-gradient(135deg,#0b5cab,#174ea6);color:#fff;padding:20px 16px;position:sticky;top:0;z-index:5}.wrap{max-width:900px;margin:auto;padding:14px}h1{margin:0;font-size:23px}header p{margin:5px 0 10px;opacity:.9;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:20px;display:block}.stat span,.small,.meta,.count{font-size:11px;color:var(--muted)}.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:12px 0}.bar{height:100%;background:var(--green);width:0}.filters{display:flex;gap:7px;overflow:auto;padding:10px 0;position:sticky;top:74px;background:var(--bg);z-index:4}.filters button,.addbtn,.report{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;font-weight:700;white-space:nowrap}.filters .active,.addbtn,.report{background:var(--blue);color:#fff;border-color:var(--blue)}.day{margin:14px 0}.day h2{font-size:17px;margin:0 0 8px}.task{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.check{width:28px;height:28px;border-radius:9px;border:2px solid #98a2b3;flex:none}.done .check{background:var(--green);border-color:var(--green)}.done .check:after{content:"✓";color:#fff;display:block;text-align:center;font-weight:800;font-size:18px}.done .item{text-decoration:line-through;opacity:.55}.item{font-weight:650;line-height:1.3}.badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:8px;margin-left:4px;background:#eef4ff;color:#174ea6}.note{margin-top:7px;width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px;font-size:13px;min-height:40px}.photo{margin-top:8px}.photo input{display:none}.photo label{display:inline-block;border:1px solid var(--line);background:#f8fafc;color:#174ea6;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:700}.gallery{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.photoBox{position:relative;width:105px}.photoBox img{width:105px;height:82px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.delPhoto{position:absolute;right:3px;top:3px;border:0;background:rgba(0,0,0,.65);color:#fff;border-radius:50%;width:22px;height:22px;font-weight:800}.remove{border:0;background:none;color:#b42318;font-size:11px;margin-left:6px}.toprow{display:flex;justify-content:space-between;gap:8px;align-items:center}.addbox{margin-bottom:10px}.addbox input,.addbox select{width:100%;margin:5px 0}.empty{text-align:center;color:var(--muted);padding:30px}@media(min-width:700px){.stats{grid-template-columns:repeat(3,160px)}} 
</style></head><body><header><div class="wrap"><h1>Obra Eivind - Conclusão</h1><p>Checklist de conclusão • fotos, observações e relatório PDF</p><div class="toprow"><span id="sync" class="small" style="color:#fff">Salvo neste aparelho</span><button id="pdf" class="report">📄 Relatório PDF</button></div></div></header><main class="wrap"><div class="stats"><div class="stat"><b id="total">42</b><span>Total de serviços</span></div><div class="stat"><b id="done">0</b><span>Concluídos</span></div><div class="stat"><b id="pct">0%</b><span>Progresso</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="toprow"><strong>Cronograma</strong><span class="small" id="today"></span></div><div class="filters" id="filters"></div><div class="card addbox"><strong>Adicionar novo serviço</strong><input id="newItem" class="note" placeholder="Nome do serviço"><input id="newAmbiente" class="note" placeholder="Ambiente / local"><select id="newDia" class="note"><option>Dia 1</option><option>Dia 2</option><option>Dia 3</option><option>Dia 4</option><option>Dia 5</option><option>Dia 6</option><option>Dia 7</option></select><button id="add" class="addbtn">＋ Adicionar serviço</button></div><section id="list"></section></main>
<script>
const base=[
["Academia","Forro de madeira — ajustar/acertar?"],["Academia","Acabamento de pintura — rodapés"],["Academia","Acabamento de pintura — porta depósito"],["Academia","Alisar banheiro"],["Academia","Ducha higiênica"],["Academia","Acabamentos de tomada (espelho)"],
["Academia","Película plástica dos esquadros/esquadrias"],["Academia","Prendedor/limitador de todas as portas"],["Casa principal","Posição das luminárias (vidros do forro novo) — verificar projeto"],["Casa principal","Frontão / área gourmet — avaliar solução"],["Casa principal","Acabamento da viga — respaldo"],["Casa principal","Roda-pé marcado com alisar"],
["Casa principal","Vaso sanitário"],["Casa principal","Porcelanato parede suíte master (60x)"],["Casa principal","Porcelanato parede suíte master (saída parede)"],["Casa principal","Pintura dos rodapés do forro"],["Casa principal","Subir tomadas da cozinha para usar alinhado com o alisar da janela"],["Casa principal","Ver alinhamento do esgoto da cozinha"],
["Academia","Luminárias — Eivind / Rayssa"],["Academia","Acabamento do nicho (pintura) — misto/selto?"],["Academia","Acabamento do nicho (LED)"],["Academia","Acabamento dos ralos"],["Academia","Vazamento — sítio banheiro"],["Apartamento mãe de Rayssa","Trincado na porta (perto do alisar)"],
["Apartamento mãe de Rayssa","Rejunte piso da área de serviço"],["Apartamento mãe de Rayssa","Ver roda-pé da área de serviço"],["Apartamento mãe de Rayssa","Rejunte bancada da área de serviço"],["Apartamento mãe de Rayssa","Limpeza roda-pé vermelho"],["Apartamento mãe de Rayssa","½ esquadria do piso lateral da cozinha"],["Apartamento mãe de Rayssa","Acabamento pintura alisar (banheiro)"],
["Apartamento mãe de Rayssa","Acabamento pintura banheiro Box — parede/recorte"],["Apartamento mãe de Rayssa","Porcelanato — parede/recorte"],["Apartamento mãe de Rayssa","Arrumada de cabeceira — Eivind/Rayssa"],["Apartamento mãe de Rayssa","Alisar porta da varanda (alumínio)"],["Apartamento mãe de Rayssa","Espelho da tomada externo"],["Apartamento mãe de Rayssa","Acabamento de pintura do chapin"],
["Apartamento mãe de Rayssa","Mais brita em volta da casa"],["Garagem + Depósito","Prateleira balcão"],["Garagem + Depósito","Torneira grossa — Eivind/Rayssa"],["Garagem + Depósito","Válvula segurança boiler — Eivind/Rayssa"],["Garagem + Depósito","Acabamento pintura"],["Garagem + Depósito","Acabamento externo — Eivind/Rayssa"]];
const tasks=base.map((x,i)=>({ambiente:x[0],categoria:x[0],item:x[1],dia:"Dia "+(Math.floor(i/6)+1),seq:(i%6)+1}));const customKey="obraEivind-custom-v1",stateKey="obra7dias-v2",photoDb="obraEivindPhotos-v2";let custom=JSON.parse(localStorage.getItem(customKey)||"[]");tasks.push(...custom);let state=JSON.parse(localStorage.getItem(stateKey)||"{}"),filter="Todos",dbp=null;
function save(){localStorage.setItem(stateKey,JSON.stringify(state));render()}function done(i){return state[i]?.status==="Concluído"}function toggle(i){state[i]={...(state[i]||{}),status:done(i)?"Pendente":"Concluído"};save()}function note(i,v){state[i]={...(state[i]||{}),note:v};localStorage.setItem(stateKey,JSON.stringify(state))}
function db(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{let r=indexedDB.open(photoDb,1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id",autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return dbp}
async function putPhoto(data){let d=await db();return new Promise((res,rej)=>{let r=d.transaction("photos","readwrite").objectStore("photos").add({data});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getPhoto(id){let d=await db();return new Promise((res,rej)=>{let r=d.transaction("photos").objectStore("photos").get(id);r.onsuccess=()=>res(r.result?.data);r.onerror=()=>rej(r.error)})}
async function delPhoto(id){let d=await db();return new Promise((res,rej)=>{let t=d.transaction("photos","readwrite");t.objectStore("photos").delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
async function addPhoto(i,input){let f=input.files?.[0];if(!f)return;let reader=new FileReader();reader.onload=async()=>{let img=new Image();img.onload=async()=>{let max=1280,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.naturalWidth*s));c.height=Math.max(1,Math.round(img.naturalHeight*s));c.getContext("2d").drawImage(img,0,0,c.width,c.height);try{let id=await putPhoto(c.toDataURL("image/jpeg",.72));state[i]={...(state[i]||{}),photoIds:[...((state[i]||{}).photoIds||[]),id]};save()}catch(e){alert("Não foi possível armazenar a foto.")}};img.src=reader.result};reader.readAsDataURL(f)}
async function removePhoto(i,n){let ids=[...(state[i]?.photoIds||[])],id=ids.splice(n,1)[0];if(id)await delPhoto(id);state[i]={...(state[i]||{}),photoIds:ids};save()}
async function photos(i){let out=[];for(let id of state[i]?.photoIds||[]){let p=await getPhoto(id);if(p)out.push(p)}return out}
async function render(){let d=tasks.filter((_,i)=>done(i)).length;total.textContent=tasks.length;doneEl.textContent=d;pct.textContent=Math.round(d/tasks.length*100)+"%";bar.style.width=d/tasks.length*100+"%";let days=[...new Set(tasks.map(x=>x.dia))];filters.innerHTML='<button class="'+(filter==="Todos"?"active":"")+'">Todos</button>'+days.map(x=>'<button class="'+(filter===x?"active":"")+'">'+x+"</button>").join("");[...filters.children].forEach((b,n)=>b.onclick=()=>{filter=n?"Dia "+n:"Todos";render()});let arr=tasks.map((x,i)=>({...x,i})).filter(x=>filter==="Todos"||x.dia===filter),groups={};arr.forEach(x=>(groups[x.dia]??=[]).push(x));let out="";for(let day of Object.keys(groups)){out+='<div class="day"><h2>'+day+'</h2><div class="card">';for(let x of groups[day]){let ps=await photos(x.i);out+='<div class="task '+(done(x.i)?"done":"")+'"><div class="check" data-i="'+x.i+'"></div><div style="flex:1"><div class="item">'+esc(x.item)+' <span class="badge">'+esc(x.ambiente)+'</span></div><div class="meta">'+esc(x.categoria)+" · Serviço "+x.seq+'</div><input class="note" data-note="'+x.i+'" placeholder="Observação da execução..." value="'+esc(state[x.i]?.note||"")+'"><div class="photo"><label for="photo'+x.i+'">📷 Adicionar foto</label><input id="photo'+x.i+'" type="file" accept="image/*" capture="environment" data-photo="'+x.i+'"><div class="gallery">'+ps.map((p,n)=>'<div class="photoBox"><img src="'+p+'"><button class="delPhoto" data-del="'+x.i+'" data-n="'+n+'">×</button></div>').join("")+'</div>'+(ps.length?'<div class="count">'+ps.length+" foto"+(ps.length>1?"s":"")+" anexada"+(ps.length>1?"s":"")+"</div>":"")+'</div></div></div>'}out+="</div></div>"}list.innerHTML=out||'<div class="empty">Nenhum serviço neste filtro.</div>';document.querySelectorAll(".check").forEach(e=>e.onclick=()=>toggle(+e.dataset.i));document.querySelectorAll("[data-note]").forEach(e=>e.onchange=()=>note(+e.dataset.note,e.value));document.querySelectorAll("[data-photo]").forEach(e=>e.onchange=()=>addPhoto(+e.dataset.photo,e));document.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>removePhoto(+e.dataset.del,+e.dataset.n))}
const total=document.getElementById("total"),doneEl=document.getElementById("done"),pct=document.getElementById("pct"),bar=document.getElementById("bar"),filters=document.getElementById("filters"),list=document.getElementById("list");
add.onclick=()=>{let item=newItem.value.trim(),ambiente=newAmbiente.value.trim()||"Geral",dia=newDia.value;if(!item)return alert("Digite o nome do serviço.");let t={ambiente,categoria:ambiente,item,dia,seq:tasks.filter(x=>x.dia===dia).length+1,custom:true};tasks.push(t);custom.push(t);localStorage.setItem(customKey,JSON.stringify(custom));newItem.value="";newAmbiente.value="";render()};today.textContent=new Date().toLocaleDateString("pt-BR");
async function pdf(){try{if(!window.jspdf){let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js";document.head.appendChild(s);await new Promise((r,j)=>{s.onload=r;s.onerror=j})}let J=window.jspdf.jsPDF,doc=new J({unit:"mm",format:"a4"}),y0=16;doc.setFillColor(11,92,171);doc.rect(0,0,210,28,"F");doc.setTextColor(255,255,255);doc.setFontSize(17);doc.text("Obra Eivind - Relatório de Conclusão",14,13);doc.setFontSize(9);doc.text(new Date().toLocaleDateString("pt-BR"),14,21);let y=37;doc.setTextColor(21,32,43);let dc=tasks.filter((_,i)=>done(i)).length;doc.setFontSize(10);doc.text("Total: "+tasks.length+"   Concluídos: "+dc+"   Pendentes: "+(tasks.length-dc)+"   Progresso: "+Math.round(dc/tasks.length*100)+"%",14,y);y+=10;for(let i=0;i<tasks.length;i++){let t=tasks[i],p=await photos(i),lines=doc.splitTextToSize((done(i)?"✓ ":"○ ")+t.item+" — "+t.ambiente,182),n=state[i]?.note?doc.splitTextToSize("Obs.: "+state[i].note,182):[],h=8+lines.length*4+n.length*4+(p.length?44:0);if(y+h>282){doc.addPage();y=y0}doc.setTextColor(done(i)?21:180,done(i)?128:35,done(i)?61:24);doc.text(lines,14,y);y+=lines.length*4;doc.setTextColor(102,112,133);doc.setFontSize(8);doc.text(t.dia+" • "+t.categoria+" • Serviço "+t.seq,14,y);y+=5;if(n.length){doc.text(n,14,y);y+=n.length*4}for(let k=0;k<Math.min(3,p.length);k++)try{doc.addImage(p[k],"JPEG",14+k*55,y,50,38)}catch(e){}if(p.length)y+=43;y+=5;doc.setFontSize(10)}doc.save("Relatorio_Obra_Eivind_"+new Date().toISOString().slice(0,10)+".pdf")}catch(e){alert("Não foi possível gerar o PDF. Verifique a conexão.");console.error(e)}}
pdf.onclick=pdf;render();
</script></body></html>
